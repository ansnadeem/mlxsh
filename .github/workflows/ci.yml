name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax
        run: |
          python -m py_compile mlxsh.py
          python -m compileall -q tests

      - name: Lint
        run: |
          python -m pip install --quiet ruff
          ruff check .

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Runs without the engines installed
        env:
          MLXSH_HOME: ${{ runner.temp }}/mlxsh-home
          MLXSH_REEXECED: "1"
        run: |
          ./mlxsh.py --version
          ./mlxsh.py help
          ./mlxsh.py status
          ./mlxsh.py ls
          ./mlxsh.py config
          ./mlxsh.py config port 8080
          ./mlxsh.py config reset port

  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --quiet build
          python -m build --wheel

      - name: Install it and run the command
        env:
          MLXSH_HOME: ${{ runner.temp }}/mlxsh-home
          MLXSH_REEXECED: "1"
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet --no-deps dist/*.whl
          /tmp/check/bin/mlxsh --version
          /tmp/check/bin/mlxsh help
